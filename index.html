<script>
'use strict';
const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = value => Array.isArray(value) ? value : [];
const tone = value => ['warning','green','purple'].includes(value) ? value : '';
const idSafe = (value, fallback) => /^[A-Za-z][A-Za-z0-9_-]*$/.test(String(value)) ? String(value) : fallback;
let model, tableSerial = 0, toastTimer;
const tableModels = new Map();

function renderTable(block) {
  const tableId = 'review-table-' + (++tableSerial);
  const tabData = arr(block.tabs).length ? block.tabs.map((tab,i) => ({label:tab.label || tab.title || String(i+1), columns:arr(tab.columns).length ? tab.columns : block.columns, rows:arr(tab.rows)})) : [{label:'',columns:block.columns,rows:arr(block.rows)}];
  const state = {block,tabs:tabData,active:0,query:'',expanded:false}; tableModels.set(tableId,state);
  const max = Number(block.maxRows);
  const panels = tabData.map((tab,i) => {
    const cols=arr(tab.columns).filter(c=>c && !String(c.key).startsWith('_'));
    return `<div class="tab-panel" id="${tableId}-panel-${i}" ${i ? 'hidden' : ''} ${tabData.length>1 ? `role="tabpanel" aria-labelledby="${tableId}-tab-${i}"` : ''}>${tab.label?`<div class="print-tab-title">${esc(tab.label)}</div>`:''}<div class="table-scroll"><table><thead><tr>${cols.map(c=>`<th scope="col">${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${tab.rows.map((row,j)=>`<tr class="${tone(row._tone)?'row-'+tone(row._tone):''}" data-row="${j}" ${Number.isFinite(max)&&max>0&&j>=max?'hidden':''}>${cols.map(c=>`<td>${esc(row[c.key])}</td>`).join('')}</tr>`).join('')}<tr class="empty-row" ${tab.rows.length?'hidden':''}><td colspan="${Math.max(cols.length,1)}">暂无匹配的组织或记录</td></tr></tbody></table></div></div>`;
  }).join('');
  return `<div class="block table-box" id="${tableId}"><div class="table-top"><div><h3 class="table-title">${esc(block.title)}</h3>${block.note?`<div class="table-note">${esc(block.note)}</div>`:''}</div>${block.searchable?`<label class="table-search"><span aria-hidden="true">⌕</span><input type="search" aria-label="搜索${esc(block.title || '表格')}" placeholder="搜索大区、门店或关键词" data-search="${tableId}"></label>`:''}</div>${tabData.length>1?`<div class="tabs" role="tablist" aria-label="${esc(block.title || '组织层级')}">${tabData.map((tab,i)=>`<button type="button" class="tab" id="${tableId}-tab-${i}" role="tab" aria-controls="${tableId}-panel-${i}" aria-selected="${!i}" tabindex="${i?-1:0}" data-table="${tableId}" data-tab="${i}">${esc(tab.label)}</button>`).join('')}</div>`:''}${panels}<div class="table-bottom"><span data-count>${esc(tabData[0].rows.length)}条记录</span>${Number.isFinite(max)&&max>0?`<button class="show-more" type="button" data-expand="${tableId}" ${tabData[0].rows.length<=max?'hidden':''}>显示全部记录 ↓</button>`:''}</div></div>`;
}

function renderBlock(block) {
  if (!block || typeof block !== 'object') return '';
  switch(block.type) {
    case 'text':return `<div class="block text-block">${block.title?`<h3 class="block-title">${esc(block.title)}</h3>`:''}${arr(block.paragraphs).map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;
    case 'callout':return `<div class="block callout ${tone(block.tone)}">${block.title?`<h3>${esc(block.title)}</h3>`:''}<div>${esc(block.text)}</div></div>`;
    case 'cards':return `<div class="block cards">${arr(block.items).map(c=>`<article class="card ${tone(c.tone)}"><h3>${esc(c.title)}</h3>${c.value!=null?`<div class="card-value">${esc(c.value)}</div>`:''}<p>${esc(c.text)}</p></article>`).join('')}</div>`;
    case 'table':return renderTable(block);
    case 'bars':return `<div class="block bars">${block.title?`<h3 class="block-title">${esc(block.title)}</h3>`:''}${arr(block.items).map(b=>{const v=Number(b.value),m=Number(b.max),w=Number.isFinite(v)&&Number.isFinite(m)&&m>0?Math.min(100,Math.max(0,v/m*100)):0;return `<div class="bar-item"><div class="bar-label">${esc(b.label)}</div><div class="bar-track" aria-hidden="true"><div class="bar-fill ${tone(b.tone)}" style="width:${w}%"></div></div><div class="bar-detail">${esc(b.detail)}</div></div>`}).join('')}</div>`;
    case 'cases':return `<div class="block cases">${arr(block.items).map(c=>`<article class="case">${c.label?`<div class="case-label">${esc(c.label)}</div>`:''}<h3>${esc(c.title)}</h3><div class="case-text">${esc(c.text)}</div>${c.action?`<div class="case-action">${esc(c.action)}</div>`:''}${c.source?`<div class="case-source">${esc(c.source)}</div>`:''}</article>`).join('')}</div>`;
    case 'timeline':return `<div class="block timeline">${arr(block.items).map(t=>`<article class="time-item"><div class="time-date">${esc(t.date)}</div><h3>${esc(t.title)}</h3><p>${esc(t.text)}</p><div class="time-meta">${t.owner?`<span>负责人：${esc(t.owner)}</span>`:''}${t.check?`<span>检核：${esc(t.check)}</span>`:''}</div></article>`).join('')}</div>`;
    case 'details':return `<details class="block details"><summary>${esc(block.title)}</summary><p>${esc(block.text)}</p></details>`;
    default:return '';
  }
}

function refreshTable(id) {
  const state=tableModels.get(id),root=document.getElementById(id);if(!state||!root)return;
  const tab=state.tabs[state.active],query=state.query.toLocaleLowerCase('zh-CN'),max=Number(state.block.maxRows);let count=0,shown=0;
  root.querySelectorAll('.tab-panel').forEach((panel,i)=>{panel.hidden=i!==state.active;});
  const panel=root.querySelector(`#${id}-panel-${state.active}`);
  panel.querySelectorAll('tbody tr[data-row]').forEach(tr=>{const row=tab.rows[Number(tr.dataset.row)];const match=!query||Object.entries(row).filter(([k])=>!k.startsWith('_')).map(([,v])=>String(v??'')).join(' ').toLocaleLowerCase('zh-CN').includes(query);if(match)count++;const visible=match&&(state.expanded||!Number.isFinite(max)||max<=0||shown<max);tr.hidden=!visible;if(visible)shown++;});
  panel.querySelector('.empty-row').hidden=count>0;
  root.querySelector('[data-count]').textContent=query?`找到 ${count} 条记录`:`${tab.rows.length} 条记录`;
  const expand=root.querySelector('[data-expand]');if(expand){expand.hidden=count<=max;expand.textContent=state.expanded?'收起记录 ↑':`显示全部 ${count} 条记录 ↓`;}
  root.querySelectorAll('[role="tab"]').forEach((button,i)=>{button.setAttribute('aria-selected',String(i===state.active));button.tabIndex=i===state.active?0:-1;});
}

function notify(text){const toast=document.getElementById('toast');clearTimeout(toastTimer);toast.textContent=text;toast.classList.add('visible');toastTimer=setTimeout(()=>toast.classList.remove('visible'),2800);}
async function copyText(text,success){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);}else{const textarea=document.createElement('textarea');textarea.value=text;textarea.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(textarea);textarea.select();const ok=document.execCommand('copy');textarea.remove();if(!ok)throw Error('copy');}notify(success);}catch{notify('浏览器未允许复制，请使用浏览器菜单复制');}}

function attachEvents(){
  document.getElementById('copy-link').addEventListener('click',()=>{if(location.protocol==='file:'){alert('当前为本地文件。请将HTML文件发给伙伴，或发布到网站后复制在线链接。');}else{copyText(location.href.split('#')[0],'分享链接已复制，可直接转发');}});
  document.getElementById('copy-report').addEventListener('click',()=>copyText(model.report_text || document.getElementById('report').innerText,'完整复盘已复制'));
  document.getElementById('print-report').addEventListener('click',()=>window.print());
  let closedDetails=[];
  addEventListener('beforeprint',()=>{closedDetails=[...document.querySelectorAll('details:not([open])')];closedDetails.forEach(detail=>{detail.open=true;});});
  addEventListener('afterprint',()=>{closedDetails.forEach(detail=>{detail.open=false;});closedDetails=[];});
  document.querySelectorAll('[data-search]').forEach(input=>input.addEventListener('input',()=>{const state=tableModels.get(input.dataset.search);state.query=input.value;refreshTable(input.dataset.search);}));
  document.querySelectorAll('[data-expand]').forEach(button=>button.addEventListener('click',()=>{const state=tableModels.get(button.dataset.expand);state.expanded=!state.expanded;refreshTable(button.dataset.expand);}));
  document.querySelectorAll('[data-tab]').forEach(button=>{button.addEventListener('click',()=>{const state=tableModels.get(button.dataset.table);state.active=Number(button.dataset.tab);refreshTable(button.dataset.table);});button.addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const buttons=[...button.closest('[role="tablist"]').querySelectorAll('[role="tab"]')],current=buttons.indexOf(button);let next=current;if(event.key==='Home')next=0;else if(event.key==='End')next=buttons.length-1;else next=(current+(event.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;buttons[next].click();buttons[next].focus();});});
  const sections=[...document.querySelectorAll('.section')],links=[...document.querySelectorAll('.nav a')];
  function highlight(){let current=sections[0];const offset=innerWidth<=760?120:75;for(const section of sections){if(section.getBoundingClientRect().top<=offset)current=section;}links.forEach(link=>{const active=link.getAttribute('href')==='#'+current?.id;link.classList.toggle('active',active);active?link.setAttribute('aria-current','location'):link.removeAttribute('aria-current');});}
  let pending=false;addEventListener('scroll',()=>{if(!pending){pending=true;requestAnimationFrame(()=>{highlight();pending=false;});}},{passive:true});addEventListener('resize',highlight,{passive:true});highlight();
}

function render(data){
  model=data;const meta=data.meta||{},sections=arr(data.sections);if(!sections.length)throw Error('复盘内容尚未就绪');
  document.title=(meta.title || '在售业主面见复盘')+'｜复盘工作台';
  document.getElementById('sidebar-period').textContent=meta.week || '月末目标与行动';
  const normalized=sections.map((section,i)=>({...section,id:idSafe(section.id,'section-'+(i+1))}));
  document.getElementById('nav').innerHTML=normalized.map((s,i)=>`<a href="#${s.id}"><span class="nav-no">${esc(s.no || String(i+1).padStart(2,'0'))}</span><span>${esc(s.title)}</span></a>`).join('');
  document.getElementById('report').innerHTML=`<header class="hero"><div class="eyebrow">OWNER MEETING · MONTH-END REVIEW</div><h1>${esc(meta.title)}</h1>${meta.subtitle?`<p class="subtitle">${esc(meta.subtitle)}</p>`:''}<div class="meta-row">${meta.cutoff?`<span class="meta-item"><span class="meta-dot"></span>${esc(meta.cutoff)}</span>`:''}${meta.week?`<span class="meta-item"><span class="meta-dot"></span>${esc(meta.week)}</span>`:''}</div>${meta.notice?`<div class="notice">${esc(meta.notice)}</div>`:''}</header><div class="kpis">${arr(data.kpis).map(k=>`<article class="kpi ${tone(k.tone)}"><div class="kpi-label">${esc(k.label)}</div><div class="kpi-value">${esc(k.value)}</div><div class="kpi-note">${esc(k.note)}</div></article>`).join('')}</div>${normalized.map((s,i)=>`<section class="section" id="${s.id}" aria-labelledby="${s.id}-title"><div class="section-head"><span class="section-no">${esc(s.no || String(i+1).padStart(2,'0'))}</span><h2 id="${s.id}-title">${esc(s.title)}</h2></div>${s.summary?`<p class="section-summary">${esc(s.summary)}</p>`:''}${arr(s.blocks).map(renderBlock).join('')}</section>`).join('')}<footer class="footer"><span>上海丽兹行 · 在售业主面见项目</span><span>${esc(meta.cutoff || '')} · 月末复盘与行动</span></footer>`;
  document.getElementById('status').hidden=true;document.getElementById('report').hidden=false;document.getElementById('toolbar').hidden=false;
  attachEvents();if(location.hash){const target=document.getElementById(location.hash.slice(1));if(target)requestAnimationFrame(()=>target.scrollIntoView());}
}

try { render(JSON.parse(document.getElementById('embedded-review').textContent)); } catch(error) { console.error(error); const status=document.getElementById('status'); status.className='status error'; status.innerHTML='<h2>复盘内容暂时无法载入</h2><p>请重新下载完整的HTML文件后打开</p>'; }
</script>
