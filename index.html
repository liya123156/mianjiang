.progress-box{--progress-fixed-first:118px;--progress-fixed-second:140px}

.progress-table-subtitle{margin-top:5px;font-size:11px;color:#83718b}
.progress-table{width:100%;min-width:1660px;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:12px;line-height:1.5}
.progress-table .progress-identity-col-0{width:var(--progress-fixed-first)}
.progress-table .progress-identity-col-1{width:var(--progress-fixed-second)}
.progress-table .progress-identity-col-2{width:140px}

.progress-table .progress-metric-col{width:90px}
.progress-table th,.progress-table td{position:relative;border-right:1px solid #ddd8e3;border-bottom:1px solid #e5e0e7;padding:10px 9px;min-width:0;vertical-align:middle;text-align:center;white-space:normal;overflow-wrap:break-word;word-break:normal;font-variant-numeric:tabular-nums}
.progress-table th:last-child,.progress-table td:last-child{border-right:0}
.progress-table th{font-size:11px;line-height:1.5;font-weight:650;color:#5f476e;background:#eee6f3}
.progress-table .progress-group-head{height:40px;font-size:12px;letter-spacing:.015em;border-bottom-color:#d8ccd9}
.progress-table .progress-leaf-row th{height:53px}
.progress-table thead .progress-section-target{background:#f6d5dc;color:#853d51}
.progress-table thead .progress-section-whole{background:#dce8f8;color:#3a5c86}
.progress-table thead .progress-section-store-top{background:#dcefe5;color:#376b53}
.progress-table thead .progress-section-unit-top{background:#edf3dc;color:#5d7139}
.progress-table .progress-fixed-0{position:sticky;left:0;z-index:2;box-shadow:1px 0 0 #ddd8e3}
.progress-table .progress-fixed-1{position:sticky;left:var(--progress-fixed-first);z-index:2;box-shadow:2px 0 0 #d8cfdf,5px 0 8px -7px #38264188}
.progress-table thead .progress-fixed-0,.progress-table thead .progress-fixed-1{z-index:4;background:#eee6f3}

<script>
'use strict';
const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = value => Array.isArray(value) ? value : [];
const tone = value => ['warning','green','purple'].includes(value) ? value : '';
const ARCHIVE = JSON.parse(document.getElementById('embedded-review').textContent);
let currentMonth = monthFromUrl(), DATA = ARCHIVE.months[currentMonth];
let currentView, tableSerial = 0, toastTimer;
const tableModels = new Map();

function validMonth(month) {
  return /^\d{4}-(0[1-9]|1[0-2])$/.test(month || '') && ARCHIVE.years.includes(Number(month.slice(0,4)));
}
function monthFromUrl() {
  const month = new URLSearchParams(location.search).get('month');
  return validMonth(month) ? month : ARCHIVE.defaultMonth;
}
function monthLabel(month) { return Number(month.slice(0,4)) + '年' + Number(month.slice(5)) + '月'; }
function renderMonthControls() {
  const year = currentMonth.slice(0,4);
  document.getElementById('year-filter').innerHTML = ARCHIVE.years.map(y => `<option value="${y}">${y}年</option>`).join('');
  document.getElementById('year-filter').value = year;
  document.getElementById('month-filter').innerHTML = Array.from({length:12},(_,i) => { const m = year + '-' + String(i+1).padStart(2,'0'); return `<option value="${m}">${i+1}月${ARCHIVE.months[m] ? '（已发布）' : '（待补充）'}</option>`; }).join('');
  document.getElementById('month-filter').value = currentMonth;
  document.getElementById('archive-note').textContent = '按月留存，已发布月份可随时回看';
  document.getElementById('sidebar-period').textContent = monthLabel(currentMonth) + ' · ' + (DATA ? '复盘档案' : '资料待补充');
}
function selectMonth(month) {
  if (!validMonth(month)) return;
  currentMonth = month; DATA = ARCHIVE.months[month];
  const url = new URL(location.href); url.searchParams.set('month',month); url.hash = ''; history.replaceState(null,'',url);
  renderMonthControls(); DATA ? render(viewFromUrl()) : renderEmptyMonth();
}

function resolveView(region, store) {
  const byStore = store && DATA.views['store:' + store];
  if (byStore && (!region || byStore.region === region)) return byStore;
  return DATA.views['region:' + region] || DATA.views.company;
}
function viewKey(view) { return view.scope === 'company' ? 'company' : view.scope + ':' + view.name; }
function viewFromUrl() {
  if (!DATA) return null;
  const params = new URLSearchParams(location.search);
  const store = DATA.views['store:' + params.get('store')];
  return store || resolveView(params.get('region'), '');
}
function exportText(view) {
  const parts = [view.title, DATA.meta.cutoff + '｜' + DATA.meta.week, ''];
  for (const k of arr(view.kpis)) parts.push(k.label + '：' + k.value + (k.note ? '（' + k.note + '）' : ''));
  for (const section of arr(view.sections)) {
    parts.push('', section.title, section.summary || '');
    for (const b of arr(section.blocks)) {
      if (b.title) parts.push(b.title);
      if (b.type === 'table') {
        const tabs = arr(b.tabs).length ? b.tabs : [b];
        for (const tab of tabs) {
          if (tab.label) parts.push(tab.label);
          const columns = arr(tab.columns || b.columns).filter(c => !String(c.key).startsWith('_'));
          const groups = new Map(arr(b.columnGroups).flatMap(g => arr(g.keys).map(key => [key,g.label])));
          parts.push(columns.map(c => (groups.has(c.key) ? groups.get(c.key) + ' · ' : '') + c.label).join(' | '));
          for (const row of arr(tab.rows)) parts.push(columns.map(c => row[c.key] ?? '').join(' | '));
        }
      } else if (b.type === 'text') parts.push(...arr(b.paragraphs));
      else if (b.type === 'callout' || b.type === 'details') parts.push(b.text || '');
      else for (const item of arr(b.items)) parts.push([item.title || item.label || '', item.value ?? '', item.text || item.detail || '', item.owner ? '负责人：' + item.owner : '', item.check ? '检核：' + item.check : ''].filter(Boolean).join('｜'));
      if (b.note) parts.push(b.note);
    }
  }
  return parts.filter(p => p !== undefined).join('\n');
}
/* Replaces renderTable only. Uses the existing arr/esc/tone/tableSerial/tableModels. */
function renderTable(block) {
  const id = 'review-table-' + (++tableSerial);
  const tabs = arr(block.tabs).length ? block.tabs : [{columns:block.columns, rows:arr(block.rows)}];
  tableModels.set(id, {block,tabs,active:0,expanded:false});
  const max = Number(block.maxRows);
  const isProgress = block.variant === 'progress';
  const rateKeys = new Set(['target_rate','met_rate','gift_rate','store_top_rate','unit_top_rate']);
  const zeroBases = {met:'stock', store_top_met:'store_top_stock', unit_top_met:'unit_top_stock'};
  const allowedLevels = ['company','region','store','group','advisor'];
  const defaultGroups = [
    {label:'10月目标制定', keys:['target','target_rate'], tone:'target'},
    {label:'全盘（月度进展）', keys:['stock','met','met_rate','gift','gift_rate'], tone:'whole'},
    {label:'门店Top业主（月度进展）', keys:['store_top_stock','store_top_met','store_top_rate'], tone:'store-top'},
    {label:'户型Top业主（月度进展）', keys:['unit_top_stock','unit_top_met','unit_top_rate'], tone:'unit-top'}
  ];
  const groupTone = value => ['target','whole','store-top','unit-top'].includes(value) ? value : 'whole';
  function parsedPercent(value) {
    const match = String(value == null ? '' : value).trim().match(/^(-?\d+(?:\.\d+)?)\s*%$/);
    return match ? Math.min(100,Math.max(0,Number(match[1]))) : null;
  }
  const panels = tabs.map((tab,i) => {
    const cols = arr(tab.columns || block.columns).filter(c => !String(c.key).startsWith('_'));
    const progress = isProgress && cols.length === 17;
    const headers = cols.map((c,j) => `${id}-p${i}-h${j}`);
    const groups = arr(tab.columnGroups || block.columnGroups).length ? arr(tab.columnGroups || block.columnGroups) : defaultGroups;
    const groupByKey = new Map();
    groups.forEach((g,gi) => arr(g.keys).forEach(k => groupByKey.set(k,{...g,index:gi})));
    function columnClass(c,j) {
      if (!progress) return '';
      const group = groupByKey.get(c.key);
      return ['progress-col', j < 4 ? 'progress-identity' : 'progress-metric', j < 2 ? `progress-fixed-${j}` : '', rateKeys.has(c.key) ? 'progress-rate' : '', group ? 'progress-section-' + groupTone(group.tone) : ''].filter(Boolean).join(' ');
    }
    let head;
    if (progress) {
      // All 17 leaf columns remain in block.columns for text and Word exports.
      // The first four identities span both header rows; metadata groups the rest.
      const identity = cols.slice(0,4).map((c,j) => `<th id="${headers[j]}" scope="col" rowspan="2" class="${columnClass(c,j)}">${esc(c.label)}</th>`).join('');
      const groupHeads = groups.map((g,gi) => {
        const keys = arr(g.keys).filter(k => cols.slice(4).some(c => c.key === k));
        const span = keys.length || Math.max(1,Number(g.colspan) || 1);
        return `<th id="${id}-p${i}-g${gi}" scope="colgroup" colspan="${span}" class="progress-group-head progress-section-${groupTone(g.tone)}">${esc(g.label)}</th>`;
      }).join('');
      const leaves = cols.slice(4).map((c,j) => `<th id="${headers[j+4]}" scope="col" class="${columnClass(c,j+4)}">${esc(c.label)}</th>`).join('');
      head = `<thead><tr class="progress-group-row">${identity}${groupHeads}</tr><tr class="progress-leaf-row">${leaves}</tr></thead>`;
    } else {
      head = `<thead><tr>${cols.map(c => `<th scope="col">${esc(c.label)}</th>`).join('')}</tr></thead>`;
    }
    const rows = arr(tab.rows).map((row,j) => {
      const level = allowedLevels.includes(row._level) ? row._level : 'advisor';
      const classes = [tone(row._tone) ? 'row-' + tone(row._tone) : '', row._priority ? 'priority-row' : '', progress ? 'progress-level-' + level : ''].filter(Boolean).join(' ');
      const cells = cols.map((c,ci) => {
        if (!progress) return `<td>${esc(row[c.key])}</td>`;
        const group = groupByKey.get(c.key);
        const classes = [columnClass(c,ci)];
        if (zeroBases[c.key] && Number(row[c.key]) === 0 && Number(row[zeroBases[c.key]]) > 0) classes.push('progress-zero');
        const value = row[c.key];
        const percent = rateKeys.has(c.key) ? parsedPercent(value) : null;
        const bar = percent == null ? '' : `<span class="progress-rate-bar" style="--progress-value:${percent}%" aria-hidden="true"></span>`;
        const hs = group ? `${id}-p${i}-g${group.index} ${headers[ci]}` : headers[ci];
        return `<td class="${classes.join(' ')}" headers="${hs}">${bar}<span class="progress-cell-value">${esc(value)}</span></td>`;
      }).join('');
      return `<tr class="${classes}" data-row="${j}" ${progress ? `data-level="${level}"` : ''} ${max > 0 && j >= max ? 'hidden' : ''}>${cells}</tr>`;
    }).join('');
    const colgroup = progress ? `<colgroup>${cols.map((c,j) => `<col class="${j < 4 ? 'progress-identity-col progress-identity-col-' + j : 'progress-metric-col'}">`).join('')}</colgroup>` : '';
    return `<div class="tab-panel" id="${id}-panel-${i}" ${i ? 'hidden' : ''} ${tabs.length > 1 ? `role="tabpanel" aria-labelledby="${id}-tab-${i}"` : ''}><div class="table-scroll${progress ? ' progress-scroll' : ''}"${progress ? ' role="region" tabindex="0" aria-label="' + esc((block.title || '进展表') + '，含17个字段，可横向滚动查看') + '"' : ''}><table${progress ? ' class="progress-table"' : ''}>${colgroup}${head}<tbody>${rows}${!arr(tab.rows).length ? `<tr class="empty-row"><td colspan="${Math.max(1,cols.length)}">当前范围暂无记录</td></tr>` : ''}</tbody></table></div></div>`;
  }).join('');
  return `<div class="block table-box${isProgress ? ' progress-box' : ''}" id="${id}"><div class="table-top"><div><h3 class="table-title">${esc(block.title)}</h3>${block.subtitle ? `<div class="progress-table-subtitle">${esc(block.subtitle)}</div>` : ''}${block.note ? `<div class="table-note">${esc(block.note)}</div>` : ''}${isProgress ? '<div class="progress-scroll-hint">左右滑动查看全部17个字段</div>' : ''}</div></div>${tabs.length > 1 ? `<div class="tabs" role="tablist" aria-label="${esc(block.title)}">${tabs.map((t,i) => `<button class="tab" type="button" id="${id}-tab-${i}" role="tab" aria-selected="${!i}" aria-controls="${id}-panel-${i}" tabindex="${i ? -1 : 0}" data-table="${id}" data-tab="${i}">${esc(t.label || t.title)}</button>`).join('')}</div>` : ''}${panels}<div class="table-bottom"><span data-count>${arr(tabs[0].rows).length}条记录</span>${max > 0 ? `<button class="show-more" type="button" data-expand="${id}" ${arr(tabs[0].rows).length <= max ? 'hidden' : ''}>显示全部记录 ↓</button>` : ''}</div></div>`;
}

function renderBlock(b) {
  switch (b.type) {
    case 'text': return `<div class="block text-block">${b.title ? `<h3 class="block-title">${esc(b.title)}</h3>` : ''}${arr(b.paragraphs).map(p => `<p>${esc(p)}</p>`).join('')}</div>`;
    case 'callout': return `<div class="block callout ${tone(b.tone)}">${b.title ? `<h3>${esc(b.title)}</h3>` : ''}<div>${esc(b.text)}</div></div>`;
    case 'cards': return `<div class="block cards">${arr(b.items).map(c => `<article class="card ${tone(c.tone)}"><h3>${esc(c.title)}</h3>${c.value != null ? `<div class="card-value">${esc(c.value)}</div>` : ''}<p>${esc(c.text)}</p></article>`).join('')}</div>`;
    case 'table': return renderTable(b);
    case 'bars': return `<div class="block bars">${b.title ? `<h3 class="block-title">${esc(b.title)}</h3>` : ''}${arr(b.items).map(c => `<div class="bar-item"><div class="bar-label">${esc(c.label)}</div><div class="bar-track" aria-hidden="true"><div class="bar-fill ${tone(c.tone)}" style="width:${Math.min(100,Math.max(0,Number(c.value) / Math.max(1,Number(c.max)) * 100))}%"></div></div><div class="bar-detail">${esc(c.detail)}</div></div>`).join('')}</div>`;
    case 'cases': return `<div class="block cases">${arr(b.items).map(c => `<article class="case"><div class="case-label">${esc(c.label)}</div><h3>${esc(c.title)}</h3><div class="case-text">${esc(c.text)}</div>${c.source ? `<div class="case-source">${esc(c.source)}</div>` : ''}</article>`).join('')}</div>`;
    case 'timeline': return `<div class="block timeline">${arr(b.items).map(c => `<article class="time-item"><div class="time-date">${esc(c.date)}</div><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p><div class="time-meta">${c.owner ? `<span>负责人：${esc(c.owner)}</span>` : ''}${c.check ? `<span>检核：${esc(c.check)}</span>` : ''}</div></article>`).join('')}</div>`;
    case 'details': return `<details class="block details"><summary>${esc(b.title)}</summary><p>${esc(b.text)}</p></details>`;
    default: return '';
  }
}
function refreshTable(id) {
  const s = tableModels.get(id), root = document.getElementById(id);
  if (!s || !root) return;
  root.querySelectorAll('.tab-panel').forEach((p,i) => { p.hidden = i !== s.active; });
  const rows = arr(s.tabs[s.active].rows), max = Number(s.block.maxRows);
  root.querySelectorAll(`#${id}-panel-${s.active} tr[data-row]`).forEach(tr => { tr.hidden = max > 0 && !s.expanded && Number(tr.dataset.row) >= max; });
  root.querySelector('[data-count]').textContent = rows.length + '条记录';
  const expand = root.querySelector('[data-expand]');
  if (expand) { expand.hidden = rows.length <= max; expand.textContent = s.expanded ? '收起记录 ↑' : `显示全部 ${rows.length} 条记录 ↓`; }
  root.querySelectorAll('[role="tab"]').forEach((b,i) => { b.setAttribute('aria-selected',String(i === s.active)); b.tabIndex = i === s.active ? 0 : -1; });
}
function notify(message) {
  const toast = document.getElementById('toast'); clearTimeout(toastTimer); toast.textContent = message; toast.classList.add('visible'); toastTimer = setTimeout(() => toast.classList.remove('visible'),2800);
}
async function copyText(text, success) {
  try {
    let copied = false;
    if (navigator.clipboard && window.isSecureContext) { try { await navigator.clipboard.writeText(text); copied = true; } catch {} }
    if (!copied) { const t = document.createElement('textarea'); t.value = text; t.style.cssText = 'position:fixed;left:-9999px'; document.body.append(t); t.select(); const ok = document.execCommand('copy'); t.remove(); if (!ok) throw Error('copy'); }
    notify(success);
  } catch { notify('浏览器未允许复制，请使用浏览器菜单复制'); }
}
function updateUrl(view) {
  const url = new URL(location.href); url.searchParams.delete('region'); url.searchParams.delete('store');
  url.searchParams.set('month',currentMonth);
  if (view.region) url.searchParams.set('region',view.region);
  if (view.scope === 'store') url.searchParams.set('store',view.store || view.name);
  history.replaceState(null,'',url);
}
function render(view, syncUrl = false) {
  currentView = view; tableModels.clear(); tableSerial = 0;
  if (syncUrl) updateUrl(view);
  document.title = view.title + '｜复盘工作台';
  document.getElementById('region-filter').innerHTML = '<option value="">全司 · 全部大区</option>' + DATA.regions.map(r => `<option value="${esc(r.name)}">${esc(r.name)}</option>`).join('');
  document.getElementById('region-filter').value = view.region || '';
  const stores = DATA.regions.flatMap(r => (!view.region || r.name === view.region) ? r.stores : []);
  document.getElementById('store-filter').innerHTML = '<option value="">全部门店</option>' + stores.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
  document.getElementById('store-filter').value = view.scope === 'store' ? view.store || view.name : '';
  document.getElementById('scope-badge').textContent = (view.scope === 'company' ? '全司' : view.scope === 'region' ? '大区' : '门店') + '视角';
  document.getElementById('scope-live').textContent = '当前查看：' + view.name + ' · ' + view.role;
  const sections = arr(view.sections), meta = DATA.meta;
  document.getElementById('nav').innerHTML = sections.map(s => `<a href="#${esc(s.id)}"><span class="nav-no">${esc(s.no)}</span><span>${esc(s.title)}</span></a>`).join('');
  document.getElementById('report').innerHTML = `<header class="hero"><div class="eyebrow">OWNER MEETING · MONTHLY REVIEW</div><h1>${esc(view.title)}</h1><p class="subtitle">${esc(view.name)} · 目标进展、上周复盘与本周重点</p><div class="meta-row"><span class="meta-item"><span class="meta-dot"></span>${esc(meta.cutoff)}</span><span class="meta-item"><span class="meta-dot"></span>${esc(meta.week)}</span><span class="meta-item">${esc(meta.source_note)}</span></div></header><div class="kpis">${arr(view.kpis).map(k => `<article class="kpi ${tone(k.tone)}"><div class="kpi-label">${esc(k.label)}</div><div class="kpi-value">${esc(k.value)}</div><div class="kpi-note">${esc(k.note)}</div></article>`).join('')}</div>${sections.map(s => `<section class="section" id="${esc(s.id)}" aria-labelledby="${esc(s.id)}-title"><div class="section-head"><span class="section-no">${esc(s.no)}</span><h2 id="${esc(s.id)}-title">${esc(s.title)}</h2></div>${s.summary ? `<p class="section-summary">${esc(s.summary)}</p>` : ''}${arr(s.blocks).map(renderBlock).join('')}</section>`).join('')}<footer class="footer"><span>上海丽兹行 · 在售业主面见项目</span><span>${esc(meta.updated_label || meta.cutoff)} · 目标进展与本周行动</span></footer>`;
  const word = document.getElementById('word-download');
  word.hidden = view.scope !== 'company' || !DATA.word_url;
  word.href = DATA.word_url || '#'; word.download = DATA.word_filename || (currentMonth + '面见复盘.docx');
  document.getElementById('copy-report').disabled = false; document.getElementById('print-report').disabled = false;
  document.getElementById('status').hidden = true; document.getElementById('report').hidden = false; document.getElementById('toolbar').hidden = false; document.getElementById('scope-panel').hidden = false;
  highlight();
}
function renderEmptyMonth() {
  currentView = null; tableModels.clear();
  const label = monthLabel(currentMonth), defaultData = ARCHIVE.months[ARCHIVE.defaultMonth];
  document.title = label + '在售业主面见复盘｜复盘工作台';
  document.getElementById('nav').innerHTML = defaultData.views.company.sections.map(s => `<a href="#month-empty" aria-disabled="true"><span class="nav-no">${esc(s.no)}</span><span>${esc(s.title)}</span></a>`).join('');
  document.getElementById('report').innerHTML = `<header class="hero"><div class="eyebrow">OWNER MEETING · MONTHLY REVIEW</div><h1>${label}在售业主面见复盘</h1><p class="subtitle">按月留存 · 同一链接持续更新</p></header><div class="month-empty" id="month-empty"><h2>本月复盘暂未录入</h2><p>${label}尚未补充目标、面见与礼物数据及复盘记录。补充后可在这里查看，本月不会显示其他月份的数据。</p><a class="btn" href="?month=${ARCHIVE.defaultMonth}" data-month-jump="${ARCHIVE.defaultMonth}">查看${monthLabel(ARCHIVE.defaultMonth)}已发布复盘</a></div>`;
  document.getElementById('scope-panel').hidden = true; document.getElementById('status').hidden = true; document.getElementById('report').hidden = false; document.getElementById('toolbar').hidden = false;
  document.getElementById('word-download').hidden = true; document.getElementById('word-download').href = '#';
  document.getElementById('copy-report').disabled = true; document.getElementById('print-report').disabled = true;
}
function highlight() {
  const sections = [...document.querySelectorAll('.section')]; let current = sections[0];
  for (const s of sections) if (s.getBoundingClientRect().top <= (innerWidth <= 760 ? document.querySelector('.sidebar').getBoundingClientRect().height + 22 : 75)) current = s;
  document.querySelectorAll('.nav a').forEach(a => { const active = a.hash === '#' + current?.id; a.classList.toggle('active',active); active ? a.setAttribute('aria-current','location') : a.removeAttribute('aria-current'); });
}
function attachEvents() {
  document.getElementById('year-filter').addEventListener('change',e => selectMonth(e.target.value + '-' + currentMonth.slice(5)));
  document.getElementById('month-filter').addEventListener('change',e => selectMonth(e.target.value));
  document.getElementById('region-filter').innerHTML = '<option value="">全司 · 全部大区</option>' + ARCHIVE.months[ARCHIVE.defaultMonth].regions.map(r => `<option value="${esc(r.name)}">${esc(r.name)}</option>`).join('');
  document.getElementById('region-filter').addEventListener('change',e => render(resolveView(e.target.value,''),true));
  document.getElementById('store-filter').addEventListener('change',e => render(resolveView(document.getElementById('region-filter').value,e.target.value),true));
  document.getElementById('reset-filter').addEventListener('click',() => render(DATA.views.company,true));
  document.getElementById('copy-link').addEventListener('click',() => { const url = new URL(location.href); url.searchParams.set('month',currentMonth); url.hash = ''; copyText(url.href,'当前月份与查看范围的链接已复制，可直接转发'); });
  document.getElementById('copy-report').addEventListener('click',() => copyText(exportText(currentView),'当前复盘已复制'));
  document.getElementById('print-report').addEventListener('click',() => window.print());
  document.getElementById('report').addEventListener('click',e => {
    const jump = e.target.closest('[data-month-jump]');
    if (jump) { e.preventDefault(); selectMonth(jump.dataset.monthJump); return; }
    const expand = e.target.closest('[data-expand]'), tab = e.target.closest('[data-tab]');
    if (expand) { const s = tableModels.get(expand.dataset.expand); s.expanded = !s.expanded; refreshTable(expand.dataset.expand); }
    if (tab) { const s = tableModels.get(tab.dataset.table); s.active = Number(tab.dataset.tab); refreshTable(tab.dataset.table); }
  });
  document.getElementById('report').addEventListener('keydown',e => {
    const tab = e.target.closest('[data-tab]'); if (!tab || !['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
    e.preventDefault(); const buttons = [...tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]')]; let i = buttons.indexOf(tab);
    i = e.key === 'Home' ? 0 : e.key === 'End' ? buttons.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + buttons.length) % buttons.length;
    buttons[i].click(); buttons[i].focus();
  });
  let previousPrintState = [], closedDetails = [];
  addEventListener('beforeprint',() => { previousPrintState = [...tableModels].map(([id,s]) => [id,s.expanded]); for (const [id,s] of tableModels) { s.expanded = true; refreshTable(id); } closedDetails = [...document.querySelectorAll('details:not([open])')]; closedDetails.forEach(d => { d.open = true; }); });
  addEventListener('afterprint',() => { for (const [id,expanded] of previousPrintState) { const s = tableModels.get(id); if (s) { s.expanded = expanded; refreshTable(id); } } closedDetails.forEach(d => { d.open = false; }); });
  let pending = false; addEventListener('scroll',() => { if (!pending) { pending = true; requestAnimationFrame(() => { highlight(); pending = false; }); } },{passive:true});
  addEventListener('resize',highlight,{passive:true}); addEventListener('popstate',() => { currentMonth = monthFromUrl(); DATA = ARCHIVE.months[currentMonth]; renderMonthControls(); DATA ? render(viewFromUrl()) : renderEmptyMonth(); });
}
try { attachEvents(); renderMonthControls(); DATA ? render(viewFromUrl()) : renderEmptyMonth(); if (location.hash) requestAnimationFrame(() => document.getElementById(location.hash.slice(1))?.scrollIntoView()); }
catch (error) { console.error(error); const status = document.getElementById('status'); status.className = 'status error'; status.innerHTML = '<h2>复盘内容暂时无法载入</h2><p>请刷新页面后重试</p>'; }

</script>
</body>
